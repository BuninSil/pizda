# Deploy the relay Worker from a computer:
#
#   cd worker
#   npm i -g wrangler
#   wrangler login
#   wrangler secret put UPDATE_SECRET   # same value baked into the app as RELAY_SECRET
#   wrangler deploy
#
# Your Worker URL is printed by `wrangler deploy`
# (https://phone-mcp.<your-subdomain>.workers.dev). Put that (without a trailing
# slash) into the app's "Постоянный адрес", or bake it in as RELAY_WORKER.

name = "phone-mcp"
main = "phone-mcp-worker.js"
compatibility_date = "2024-09-01"

[[durable_objects.bindings]]
name = "PHONE_RELAY"
class_name = "PhoneRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhoneRelay"]
